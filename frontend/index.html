<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Alunos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Gestão de Alunos</h1>

    <form id="form-aluno">
      <input type="hidden" id="id">
      <input id="nome" placeholder="Nome" required>
      <input id="apelido" placeholder="Apelido" required>
      <select id="idCurso" required></select>
      <input id="anoCurricular" type="number" min="1" max="5" placeholder="Ano" required>
      <button type="submit" id="btn-guardar">Adicionar</button>
      <button type="button" id="btn-cancelar" hidden>Cancelar</button>
    </form>

    <table>
      <thead>
        <tr><th>Nome</th><th>Apelido</th><th>Curso</th><th>Ano</th><th>Ações</th></tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
    <p id="msg"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
